name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-22.04
    env:
      # An incremental cache is only written here, never reused by the next run.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      # The kit links against fontconfig and freetype; GPUI loads Wayland and Vulkan at run time
      # and opens no window here: the tests use GPUI's own test platform.
      - name: Have the window's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # Without the omarchy feature, the kit names no desktop: the app-word scan checks that build.
      - run: cargo clippy --all-targets --locked --no-default-features -- -D warnings
      - run: cargo test --locked --no-default-features
